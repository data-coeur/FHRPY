[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhrpy"
version = "0.0.1"
description = "Python toolbox for Fetal Heart Rate analysis (WMFB baseline, false-signal detection) with a web-based CTG viewer. Python port of FHRMA."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Samuel Boudet and contributors" }]
keywords = ["cardiotocography", "CTG", "fetal heart rate", "FHR", "obstetrics", "signal processing"]
dependencies = [
  "numpy>=1.21",
  # SciPy is used for: Butterworth coefficient design (signal.butter / cheby1),
  # plain causal IIR (lfilter) and polyphase resampling (resample_poly). The
  # zero-phase filtfilt itself is reimplemented in pure NumPy (fhrpy.preprocess.dsp)
  # to be bit-faithful to FHRMA's multisigfilter.c. resample_poly's padtype='line'
  # requires SciPy >= 1.6.
  "scipy>=1.6",
]

[project.optional-dependencies]
viewer = ["jinja2>=3.0"]
training = ["scikit-learn>=1.0"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/data-coeur/FHRPY"
Repository = "https://github.com/data-coeur/FHRPY"

[tool.setuptools.packages.find]
include = ["fhrpy*"]

[tool.setuptools.package-data]
"fhrpy.viewer" = ["web/**/*"]
"fhrpy.falsesignal" = ["weights/*.mat"]
# Bundled FHRMA datasets (full morpho train+test, FS dopmhr+scalp all splits)
# + expert-label marker / baseline files.
"fhrpy.datasets" = ["ctg/*", "morpho/*", "fs/*"]
# The TensorFlow training sources in fhrpy/training/ require TensorFlow 2 to run,
# but TF is intentionally NOT a dependency: it is never imported by the package.
"fhrpy.training" = ["*.ipynb", "*.py", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
