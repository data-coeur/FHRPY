[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhrpy"
version = "0.0.1"
description = "Python toolbox for Fetal Heart Rate analysis (WMFB baseline, false-signal detection) with a web-based CTG viewer. Python port of FHRMA."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Samuel Boudet and contributors" }]
keywords = ["cardiotocography", "CTG", "fetal heart rate", "FHR", "obstetrics", "signal processing"]
dependencies = [
  "numpy>=1.21",
]

[project.optional-dependencies]
viewer = ["jinja2>=3.0"]
training = ["scikit-learn>=1.0"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/data-coeur/FHRPY"
Repository = "https://github.com/data-coeur/FHRPY"

[tool.setuptools.packages.find]
include = ["fhrpy*"]

[tool.setuptools.package-data]
"fhrpy.viewer" = ["web/**/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
