<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>example_recording.fhr</title>
<style>
/*
 * fhrviewer.css — self-contained styles for the vanilla FHRViewer.
 * Bootstrap rules dropped; the whole widget sits on a white background.
 */

.fhr-viewer {
  display: block;
  height: 600px;
  box-sizing: border-box;
  background: #fff;
  font-family: Arial, Helvetica, sans-serif;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

.fhr-viewer * {
  box-sizing: border-box;
}

.fhr-viewer .graph {
  position: relative;
  min-width: 100px;
  min-height: 80px;
  height: calc(100% - 94px);
  cursor: pointer;
  overflow: hidden;
  background: #fff;
}

/* bottom drag handle to resize the viewer height: a uniform light-grey bar
   with a centred grip (a striped gradient read as "transparent" on ward
   screens), set apart from the buttons by a small margin */
.fhr-viewer .resizebar {
  position: relative;
  width: 100%;
  height: 12px;
  margin-top: 6px;
  background: #e9edec;
  border-top: 1px solid #dde5e1;
  border-radius: 0 0 6px 6px;
  cursor: row-resize;
}
.fhr-viewer .resizebar::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 3px;
  width: 36px;
  height: 5px;
  margin-left: -18px;
  border-top: 1px solid #9aa8a3;
  border-bottom: 1px solid #9aa8a3;
}
.fhr-viewer .resizebar:hover {
  background: #d6e4ff;
}

.fhr-viewer .graph .background-canvas,
.fhr-viewer .graph .frontground-svg {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
}

.fhr-viewer .eventTextEdit {
  display: none;
  position: absolute;
  width: auto;
  height: auto;
  z-index: 2;
  font: 16px Arial;
  border: 1px solid #888;
  resize: none;
  overflow: hidden;
}

/* --- controllers: full-width scrollbar row on top, button row below ----- */
.fhr-viewer .controllers {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 6px 6px 0;
  background: #fff;
}

/* the scrollbar row: the track, then the "follow live" control at its right end */
.fhr-viewer .fhr-viewer-scrollbar {
  position: relative;
  display: flex;
  align-items: stretch;
  width: 100%;
  height: 22px;
  margin: 0;
}

.fhr-viewer .scrollbarTrack {
  position: relative;
  flex: 1 1 auto;
  min-width: 40px;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.05);
  box-shadow: inset 1px 1px 16px rgba(0, 0, 0, 0.1);
  border-radius: 10px;
}

.fhr-viewer .scrollbarDragger {
  position: absolute;
  min-width: 30px;
  display: block;
  width: 10%;
  max-width: 100%;
  left: 0;
  height: 100%;
  cursor: pointer;
  z-index: 1;
}

.fhr-viewer .scrollbarDraggerBar {
  background-color: #777;
  box-shadow: inset 1px 0 0 rgba(255, 255, 255, 0.4), inset -1px 0 0 rgba(0, 0, 0, 0.2);
  height: 18px;
  margin: 2px;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  border-radius: 8px;
}

/* --- button row -------------------------------------------------------- */
.fhr-viewer .controller-icons {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
}

.fhr-viewer .btn-fhr-icons {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0;
  min-width: 38px;
  height: 38px;
  border: 1px solid #bbb;
  border-radius: 6px;
  background: #f6f6f6;
  cursor: pointer;
  color: #333;
  line-height: 1.05;
}

.fhr-viewer .btn-fhr-icons.text {
  font-size: 12px;
  font-weight: bold;
  padding: 0 6px;
}

.fhr-viewer .btn-fhr-icons.icon svg {
  width: 24px;
  height: 24px;
  display: block;
}

.fhr-viewer .btn-fhr-icons:hover {
  background: #e8e8e8;
}

.fhr-viewer .btn-fhr-icons.active {
  background: #cde6ff;
  border-color: #5a9bd4;
}

/* --- "follow live" control, at the right end of the scrollbar row --------- */
.fhr-viewer .btn-fhr-icons.btn-follow {
  flex: 0 0 auto;
  height: 100%;
  min-width: 34px;
  margin-left: 4px;
  padding: 0 5px;
  border-radius: 10px;
}

.fhr-viewer .btn-fhr-icons.btn-follow svg {
  width: 18px;
  height: 18px;
}
html, body { margin: 0; padding: 0; background: #fff; }
#fhr-host { width: 100%; background: #fff; }
</style>
</head>
<body>
<div id="fhr-host"></div>
<script type="module">
/*
 * FHRViewer — vanilla ES module CTG (cardiotocography / fetal heart rate) viewer.
 *
 * A clean, dependency-free re-implementation of the legacy jQuery/PHP viewer
 * (fhrgraphplot-source.js / fhrsignal-source.js / fhrviewer-source.js /
 * scrollbar-source.js). No jQuery, no bootstrap, no build step, no AJAX/PHP.
 *
 * The drawing maths (grid geometry, winlength scaling, vertical mappings,
 * drawSigFast, drawPeriods/fillSurface, measurer and marks) are ported
 * verbatim from the original so the output matches the reference viewer.
 *
 * New features beyond the original:
 *   - toggle colored zones (acc green / dec red / contraction TOCO)
 *   - independent FHR / MHR channel visibility
 *   - linear interpolation across missing points ("interpolate gaps" mode)
 *   - configurable channels displayed per graph
 *   - dynamic height + responsive width (ResizeObserver)
 *   - public JS API + event emitter + postMessage bridge for a Python backend
 *
 * Binary format (little-endian), ported from fhrsignal-source.js:
 *   Header: [uint32 startEpoch seconds] (dataset / acquisition files, 4 bytes)
 *           or [uint32 magic][uint32 startEpoch seconds] (recorder files, 8);
 *           the length is auto-detected by divisibility of the body (the rule
 *           of fhrpy.io.read_fhr) unless `opts.headerBytes` forces it.
 *   Optional [uint32 code] (1234567 recording / 1234568 finished) after an
 *           8-byte header: the legacy streamed payload — skipped if present.
 *   Then N samples at 4 Hz — bytes per sample from the extension, or from
 *   `opts.bytesPerSample` when the extension is ambiguous (OpenCTG's `.fhr`
 *   is 8 bytes/sample, FHRMA's is 6):
 *     .rcf / .fhr  (6 bytes):  u16 FHR1, u16 FHR2, u8 TOCO, u8 qual
 *     .rcfm / .fhrm (8 bytes): u16 FHR1, u16 FHR2, u16 MHR, u8 TOCO, u8 qual
 *     .rcfa       (12 bytes):  + u16 FHRi (preprocessed), u16 baseline
 *   Scaling: FHR/MHR/FHRi/baseline = raw/4 ; TOCO = raw/2.
 *   Missing / lost signal = value 0 (or <=40 for FHR) -> breaks the curve.
 *
 * Marker text conventions (companion `.fhrh` / `.marks` file):
 *   `$ TTT N`  computed zone (ACC / DEC / CON / URS), painted, never as text
 *   `£text`    protected marker (sensor change, monitor note): blue, not editable
 *   `£!text`   protected ALERT marker (device failure): red, not editable
 *   `§key k=v` protected metadata (device model, serial…): never drawn
 *   anything else: a free, editable event marker (orange)
 */

const SVGNS = 'http://www.w3.org/2000/svg';
const MAGIC = 1234555;          // header magic (validity check, best-effort)
const CODE_RECORDING = 1234567; // optional data-stream code
const CODE_FINISHED = 1234568;
const GRID_COLOR = '#AAFFAA';   // classic CTG green grid
const PAPER_COLOR = '#FFFFFF';  // pure white paper, on screen and in print
const SAFE_BAND_COLOR = '#F0F0F0';      // grey band behind the normal FHR range
const MARK_COLOR = '#FFBB00';           // free event markers (orange)
const PROTECTED_MARK_COLOR = '#0000FF'; // `£` markers (blue)
const ALERT_MARK_COLOR = '#c2483b';     // `£!` markers: device alert / failure (red)

const DEFAULT_COLORS = {
  FHR1: '#FF0000',     // red
  FHR2: '#0000FF',     // blue
  MHR: '#FF00FF',      // magenta
  FHRi: '#AAAAAA',     // preprocessed (gray)
  baseline: '#202020', // baseline (near-black)
  TOCO: '#000000',
};

// Lighter shade per channel: false-signal samples are drawn in these instead of
// the full color (like the FHRMA toolbox), rather than as an opaque column.
const LIGHT_COLORS = {
  FHR1: '#FFB3B3',     // light red
  FHR2: '#B3B3FF',     // light blue
  MHR: '#FFB3EC',      // light pink
};

/* ----------------------------------------------------------------------------
 * Signals — in-memory recording (parsing + markers), no network.
 * ------------------------------------------------------------------------- */
class Signals {
  constructor() {
    this.srate = 4;
    this.minRCF = 50;     // top FHR grid bounds (configurable)
    this.maxRCF = 210;
    this.safeMin = 110;   // central "safe"/normal FHR band (configurable)
    this.safeMax = 160;
    this.minTOCO = 0;
    this.maxTOCO = 100;
    this.start = -1;
    this.lastTime = -1;
    this.bytesBySample = 8;
    // Layout hints from the host (FHRViewer opts.bytesPerSample / opts.headerBytes):
    // null / 'auto' = infer from the extension / detect from the buffer size.
    this.layout = { bytesPerSample: null, headerBytes: 'auto' };
    this.editingMark = false;
    this._reset();
  }

  _reset(startTime = 0) {
    this.RCF1 = [];
    this.RCF2 = [];
    this.RCFm = [];
    this.RCFi = [];
    this.baselineRCF = [];
    this.TOCO = [];
    this.Q = [];                // quality / sensor-mode byte of each sample (bit layout of fhrsave.m)
    this.Marks = [];
    // Bumped by every change of the marks: the display cache keys on it, and
    // editing a sensor-change marker in place must not keep a stale alignment.
    this.marksVersion = (this.marksVersion || 0) + 1;
    this.start = startTime;
    this.lastTime = startTime;
    this.badSigPoints = 0;
  }

  /** Bytes per sample implied by an extension: `.rcf` / `.fhr` 6, `.rcfa` 12, `.rcfm` / `.fhrm` / other 8. */
  static bytesPerSampleFor(ext) {
    const last = (ext || '').toLowerCase().replace('.', '').slice(-1);
    if (last === 'r' || last === 'f') return 6;
    if (last === 'a') return 12;
    return 8;
  }

  /**
   * Header length of a buffer, among `candidates` tried in order: 4 (dataset
   * and acquisition files: epoch only), 8 (recorder files: magic + epoch) or
   * 12 (8 + the legacy streamed code word, accepted only when the word really
   * is one). The first candidate whose body is a whole number of samples wins
   * — the divisibility rule of fhrpy.io.read_fhr; when none fits (a file still
   * being written) the first candidate is assumed. `.rcf*` files are recorder
   * files and prefer 8; every other extension prefers 4. Reading a 4-byte header as
   * an 8-byte one shifts every sample and draws a trace that looks plausible
   * but is wrong, which is why this is detected rather than assumed.
   */
  static detectHeader(view, stride, candidates) {
    const total = view.byteLength;
    for (const h of candidates) {
      if (total < h || (total - h) % stride !== 0) continue;
      if (h === 12) {
        const code = view.getUint32(8, true);
        if (code !== CODE_RECORDING && code !== CODE_FINISHED) continue;
      }
      return h;
    }
    return candidates[0];
  }

  /**
   * Decode an ArrayBuffer into the signal arrays. `ext` selects the bytes per
   * sample unless `layout.bytesPerSample` (or the host's `opts.bytesPerSample`)
   * says otherwise; the header length is auto-detected unless
   * `layout.headerBytes` (or `opts.headerBytes`) is 4 or 8.
   */
  loadBuffer(arrayBuffer, ext = 'rcfm', layout = {}) {
    const name = (ext || '').toLowerCase().replace('.', '');
    const bps = layout.bytesPerSample || this.layout.bytesPerSample;
    this.bytesBySample = (bps === 6 || bps === 8 || bps === 12) ? bps : Signals.bytesPerSampleFor(name);

    const view = new DataView(arrayBuffer);
    const total = view.byteLength;
    // Recorder files (`.rcf*`) carry magic + epoch, dataset and acquisition
    // files the epoch only: that is the preference when nothing divides.
    const forced = layout.headerBytes || this.layout.headerBytes;
    const candidates = forced === 4 ? [4] : forced === 8 ? [8, 12]
      : name.startsWith('rcf') ? [8, 12, 4] : [4, 8, 12];
    const off = Signals.detectHeader(view, this.bytesBySample, candidates);
    // The epoch sits in the last four bytes of the 4- or 8-byte header proper.
    const epochAt = off >= 8 ? 4 : 0;
    const startEpoch = total >= epochAt + 4 ? view.getUint32(epochAt, true) : 0;

    this._reset(startEpoch);
    const nSamp = Math.floor((total - off) / this.bytesBySample);
    for (let i = 0; i < nSamp; i++) {
      const o = off + i * this.bytesBySample;
      if (this.bytesBySample === 6) {
        this._addData(view.getUint16(o, true), view.getUint16(o + 2, true),
          view.getUint8(o + 4), view.getUint8(o + 5), 0, 0, 0);
      } else if (this.bytesBySample === 8) {
        this._addData(view.getUint16(o, true), view.getUint16(o + 2, true),
          view.getUint8(o + 6), view.getUint8(o + 7), view.getUint16(o + 4, true), 0, 0);
      } else { // 12
        this._addData(view.getUint16(o, true), view.getUint16(o + 2, true),
          view.getUint8(o + 6), view.getUint8(o + 7), view.getUint16(o + 4, true),
          view.getUint16(o + 8, true), view.getUint16(o + 10, true));
      }
    }
  }

  _addData(rcf1, rcf2, toco, qual, rcfm = 0, rcfi = 0, baseline = 0) {
    const f1 = rcf1 / 4, f2 = rcf2 / 4;
    this.RCF1.push(f1);
    this.RCF2.push(f2);
    this.TOCO.push(toco / 2);
    this.Q.push(qual | 0);
    if (this.bytesBySample > 6) {
      this.RCFm.push(rcfm / 4);
      if (this.bytesBySample > 8) {
        this.RCFi.push(rcfi / 4);
        this.baselineRCF.push(baseline / 4);
      }
    }
    this.lastTime += 1 / this.srate;
    if (f1 === 0 && f2 === 0) this.badSigPoints++;
  }

  /** Percentage of signal-loss between first and last non-null sample. */
  signalLoss() {
    let s0 = 0, first = -1, last = -1;
    for (let i = 0; i < this.RCF1.length; i++) {
      if (this.RCF1[i] > 0 || this.RCF2[i] > 0) {
        if (first === -1) first = i;
        last = i;
      }
      if (this.RCF1[i] === 0 && this.RCF2[i] === 0) s0++;
    }
    const s = this.RCF1.length;
    if (first === -1) return 100;
    return Math.round((1000 * (s0 + 2 - first - s + last)) / (last - first + 1)) / 10;
  }

  /** Parse a marker text blob: one mark per line, `SSSSSSS text` (7-digit sample). */
  loadMarkers(text) {
    this.Marks = [];
    this.marksVersion++;
    const lines = (text || '').split('\n');
    for (const line of lines) {
      if (line.length > 5) {
        this.Marks.push([parseInt(line.substr(0, 7), 10), line.substring(8, 3000)]);
      }
    }
  }

  setMarks(list) {
    // Accept [[sample, text], ...]; keep sorted by sample.
    this.Marks = (list || []).map((m) => [Math.round(m[0]), String(m[1])]);
    this.Marks.sort((a, b) => a[0] - b[0]);
    this.marksVersion++;
  }

  getMarks() {
    return this.Marks.map((m) => [m[0], m[1]]);
  }

  addMarks(s, t) {
    let index = 0;
    for (let i = 0; i < this.Marks.length; i++) if (this.Marks[i][0] < s) index++;
    this.Marks.splice(index, 0, [s, t]);
    this.marksVersion++;
    return index;
  }

  updateMark(n, t) {
    this.Marks[n][1] = t;
    if (t === '') this.Marks.splice(n, 1);
    this.marksVersion++;
  }
}

/* ----------------------------------------------------------------------------
 * ScrollBar — draggable thumb over a track. Calls back via onScroll(value,fast).
 * ------------------------------------------------------------------------- */
class ScrollBar {
  constructor(container, onScroll) {
    this.container = container;
    this.onScroll = onScroll;
    this.pageRatio = 0.1;
    this.value = 0;
    this.mouseDownOffset = -1;
    this.mouseDownValue = 0;

    this.dragger = document.createElement('div');
    this.dragger.className = 'scrollbarDragger';
    const bar = document.createElement('div');
    bar.className = 'scrollbarDraggerBar';
    this.dragger.appendChild(bar);
    this.container.appendChild(this.dragger);

    this._onTrackClick = (e) => this.clickContainer(e);
    this.container.addEventListener('click', this._onTrackClick);
    this.dragger.addEventListener('mousedown', (e) => this.mouseDownDragger(e));
  }

  setValue(v, follow, fast = 0) {
    v = Math.min(1, Math.max(0, v));
    this.value = v;
    this.dragger.style.left = `${v * (1 - this.pageRatio) * 100}%`;
    if (follow !== false && this.onScroll) this.onScroll(v, fast);
  }

  setPageRatio(r) {
    r = Math.min(1, Math.max(0.05, r));
    this.pageRatio = r;
    this.dragger.style.width = `${r * 100}%`;
    this.dragger.style.left = `${this.value * (1 - this.pageRatio) * 100}%`;
  }

  clickContainer(e) {
    const rect = this.container.getBoundingClientRect();
    const posX = e.clientX - rect.left - this.pageRatio * 0.5 * rect.width;
    this.setValue(posX / (rect.width * (1 - this.pageRatio)), true);
  }

  mouseDownDragger(e) {
    if (window.getSelection) window.getSelection().removeAllRanges();
    this.mouseDownOffset = e.clientX;
    this.mouseDownValue = this.value;
    this._move = (ev) => this.mouseMoveDragger(ev);
    this._up = (ev) => this.mouseUpDragger(ev);
    document.addEventListener('mousemove', this._move);
    document.addEventListener('mouseup', this._up);
    this.container.removeEventListener('click', this._onTrackClick);
    e.stopPropagation();
  }

  mouseMoveDragger(e) {
    const rect = this.container.getBoundingClientRect();
    const deltaX = (e.clientX - this.mouseDownOffset) / (rect.width * (1 - this.pageRatio));
    this.setValue(this.mouseDownValue + deltaX, true, true);
  }

  mouseUpDragger(e) {
    document.removeEventListener('mousemove', this._move);
    document.removeEventListener('mouseup', this._up);
    this.mouseDownOffset = -1;
    e.preventDefault();
    setTimeout(() => this.container.addEventListener('click', this._onTrackClick), 0);
    this.setValue(this.value, true, false);
  }
}

/* ----------------------------------------------------------------------------
 * GraphPlot — canvas grid + curves + svg overlays. Ported maths.
 * ------------------------------------------------------------------------- */
class GraphPlot {
  constructor(container, viewer) {
    this.viewer = viewer;
    this.container = container;
    this.signals = new Signals();
    this.canvas = container.querySelector('canvas.background-canvas');
    this.svg = container.querySelector('svg.frontground-svg');
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;

    this.eventTextEdit = document.createElement('textarea');
    this.eventTextEdit.className = 'eventTextEdit';
    container.appendChild(this.eventTextEdit);

    this.BorderLeft = 0;
    this.BorderRight = 0;
    this.BorderTop = 0;
    this.BorderBottom = 15;
    this.mouseMode = 'None';
    this.editingMark = -1;
    this.displayMorpho = true;        // baseline + accel/decel zones toggle
    this.displayContractions = true;  // contraction (TOCO) zones toggle
    this.displayFalseSignals = true;  // false-signal (URS/NTA) zones toggle
    this.displayMarks = true;         // text markers (events / decel types) toggle
    // The false-signal mask applies ONLY to the analysed fetal channel (the
    // Doppler FHR1 for kind='doppler', the scalp FHR2 for kind='scalp'); the
    // maternal MHR reference is never a "false fetal signal".
    this.falseSignalChannel = 'FHR1';
    this.fullGrid = 1;
    this.is3cm = 0;
    this.time = 0;

    // New-feature state.
    this.interpolate = false;
    this.interpMaxGap = 4 * 30; // bridge gaps up to 30 s by default
    this.channels = null;       // explicit list of channels to display, else auto
    this.tzOffset = 0;          // time-axis offset in seconds (0 = UTC; epoch 0 -> 00:00)
    this.timeZone = null;       // IANA zone name (DST-aware) for the time axis; overrides tzOffset when set
    // Per-sensor estimation delays in seconds ({doppler, scalp, mecg, mhrToco,
    // mhrOximeter, toco}) applied at display time; null = draw the raw samples.
    this.delays = null;
    this._shiftCache = new Map();

    this.bufferCanvas = document.createElement('canvas');
    this.bufferContext = this.bufferCanvas.getContext('2d');
    this.markRects = [];
    this.measurer = {};
    this.newMark = {};
    this.box1515 = {};   // reference cursor: crosshair + 30 bpm x 15 s rectangle

    this.eventTextEdit.addEventListener('keyup', () => {
      this.eventTextEdit.style.height = '0px';
      this.eventTextEdit.style.height = `${this.eventTextEdit.scrollHeight}px`;
    });
    // Enter validates the marker text, Escape cancels, leaving the field validates.
    this.eventTextEdit.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.validateMark(false); }
      else if (e.key === 'Escape') { e.preventDefault(); this.cancelMark(); }
    });
    this.eventTextEdit.addEventListener('blur', () => { if (this.editingMark !== -1) this.validateMark(false); });
    this.svg.addEventListener('mousemove', (e) => this.mouseMove(e), true);
    // The reference cursor follows the pointer: it leaves the graph with it.
    this.svg.addEventListener('mouseleave', () => this.clearBox1515());
  }

  /* --- geometry ----------------------------------------------------------- */
  resize() {
    const h = this.container.clientHeight;
    const w = this.container.clientWidth;
    this.canvas.height = h;
    this.canvas.width = w;
    this.svg.setAttributeNS(null, 'width', w);
    this.svg.setAttributeNS(null, 'height', h);
    this.TotalWidth = w;
    this.TotalHeight = h;
    this.bufferCanvas.width = w;
    this.bufferCanvas.height = h;
    this.graphWidth = w - this.BorderLeft - this.BorderRight;
    this.graphHeight = h - this.BorderTop - this.BorderBottom;
    this.RCFTOCOSpace = 0.05 * this.graphHeight;
    this.TOCOHeight = (1 / 3) * (this.graphHeight - this.RCFTOCOSpace);
    this.RCFHeight = this.graphHeight - this.RCFTOCOSpace - this.TOCOHeight;
    const sizeof20bpm = (this.RCFHeight * 20) / (this.signals.maxRCF - this.signals.minRCF);
    this.winlength = (this.graphWidth * 60) / sizeof20bpm / (1 + 2 * this.is3cm);
  }

  /* --- which FHR channels to plot ---------------------------------------- */
  _activeChannels() {
    // Returns [{name, arr, color}], honoring explicit channel list + visibility.
    const s = this.signals;
    let candidates;
    if (this.signals.bytesBySample === 6) {
      candidates = [['FHR1', s.RCF1], ['FHR2', s.RCF2]];
    } else if (this.signals.bytesBySample === 8) {
      candidates = [['FHR1', s.RCF1], ['FHR2', s.RCF2], ['MHR', s.RCFm]];
    } else {
      candidates = [['FHRi', s.RCFi], ['FHR1', s.RCF1], ['FHR2', s.RCF2],
        ['MHR', s.RCFm]];
      if (this.displayMorpho) candidates.push(['baseline', s.baselineRCF]);
    }
    const visible = this.viewer.channelVisible;
    let list = candidates;
    if (this.channels && this.channels.length) {
      const set = new Set(this.channels);
      list = candidates.filter(([name]) => set.has(name));
    }
    return list
      .filter(([name]) => visible[name] !== false)
      .map(([name, arr]) => ({
        name, arr: this._displayArray(name, arr), color: DEFAULT_COLORS[name] || '#000', light: LIGHT_COLORS[name],
      }));
  }

  /* --- per-sensor estimation delays (display-time compensation) ----------- */
  /** Samples to move a channel earlier for a delay in seconds (null / unknown = 0). */
  _shiftSamples(seconds) {
    return typeof seconds === 'number' && Number.isFinite(seconds) && seconds > 0
      ? Math.round(seconds * this.signals.srate) : 0;
  }

  /**
   * Maternal-heart-rate sensor when it is not the Toco transducer: the Q byte
   * only says "Toco or not", so the acquisition's sensor-change markers of
   * that channel (`£Purple=…` / `£Violet=…`) decide between maternal ECG and
   * pulse oximetry; without one, oximetry (the usual Philips case).
   */
  _mhrSensorSteps() {
    const steps = [];
    for (const m of this.signals.Marks || []) {
      if (!m || !/^£(Violet|Purple)=/.test(m[1])) continue;
      steps.push([m[0], /ECG/i.test(m[1]) ? 'mecg' : /TOCO/i.test(m[1]) ? 'mhrToco' : 'mhrOximeter']);
    }
    return steps.sort((a, b) => a[0] - b[0]);
  }

  /**
   * The array actually drawn for a channel: each sample moved EARLIER by the
   * delay of its own sensor mode (Q byte of that sample) — FHR by `doppler`
   * or `scalp` (isECG1 / isECG2 bits), MHR by `mhrToco` (isTOCOMHR bit),
   * `mecg` or `mhrOximeter`, TOCO by `toco`. Without delays, the raw array.
   * The tail left empty by the shift is "no signal" (0 for a heart rate, NaN
   * for the TOCO), which is why the right edge of a delayed channel sits back
   * in real time. Symmetrically, where a channel's delay DROPS going forward
   * (SpO2 12.5 s to a Toco pulse 6 s), its samples jump forward and leave a gap
   * of the difference at the sensor change: that blank is real, it is the span
   * no sensor ever estimated. A blank heart-rate sample never erases a real one that
   * another mode placed at a sensor change. Cached per channel until the
   * data, the marks or the delays change. The file itself is never modified.
   */
  _displayArray(name, arr) {
    const d = this.delays;
    if (!d || !arr || !arr.length) return arr;
    if (name !== 'FHR1' && name !== 'FHR2' && name !== 'MHR' && name !== 'TOCO') return arr;
    const sh = {
      doppler: this._shiftSamples(d.doppler), scalp: this._shiftSamples(d.scalp), mecg: this._shiftSamples(d.mecg),
      mhrToco: this._shiftSamples(d.mhrToco), mhrOximeter: this._shiftSamples(d.mhrOximeter), toco: this._shiftSamples(d.toco),
    };
    const own = name === 'TOCO' ? [sh.toco] : name === 'MHR' ? [sh.mhrToco, sh.mecg, sh.mhrOximeter] : [sh.doppler, sh.scalp];
    if (!own.some((x) => x > 0)) return arr;
    const s = this.signals;
    const key = `${arr.length}|${sh.doppler},${sh.scalp},${sh.mecg},${sh.mhrToco},${sh.mhrOximeter},${sh.toco}|${s.marksVersion}`;
    const cached = this._shiftCache.get(name);
    if (cached && cached.key === key && cached.src === arr) return cached.out;
    const Q = s.Q || [];
    const steps = name === 'MHR' ? this._mhrSensorSteps() : [];
    const isToco = name === 'TOCO';
    const out = new Array(arr.length).fill(isToco ? NaN : 0);
    let step = 0, other = 'mhrOximeter';
    for (let i = 0; i < arr.length; i++) {
      const q = Q[i] | 0;
      let k;
      if (name === 'FHR1') k = (q & 0x02) ? sh.scalp : sh.doppler;
      else if (name === 'FHR2') k = (q & 0x08) ? sh.scalp : sh.doppler;
      else if (name === 'MHR') {
        while (step < steps.length && steps[step][0] <= i) { other = steps[step][1]; step++; }
        k = (q & 0x20) ? sh.mhrToco : sh[other === 'mhrToco' ? 'mhrOximeter' : other];
      } else k = sh.toco;
      const j = i - k;
      if (j < 0) continue;
      const v = arr[i];
      if (!isToco && !(v > 0) && out[j] > 0) continue;
      out[j] = v;
    }
    this._shiftCache.set(name, { key, src: arr, out });
    return out;
  }

  /** Per-sample boolean mask of false-signal (URS/NTA) regions, from the marks. */
  _falseMask() {
    const s = this.signals;
    const N = s.RCF1.length;
    const mask = new Uint8Array(N);
    if (!s.Marks) return mask;
    for (const m of s.Marks) {
      if (!m || m[1][0] !== '$') continue;
      const type = m[1].substring(2, 5);
      if (type !== 'URS' && type !== 'NTA') continue;
      const start = Math.max(0, m[0]);
      const end = Math.min(N, m[0] + (parseInt(m[1].substring(6), 10) || 0));
      for (let i = start; i < end; i++) mask[i] = 1;
    }
    return mask;
  }

  /* --- gap interpolation -------------------------------------------------- */
  _maybeInterpolate(arr) {
    if (!this.interpolate) return arr;
    const out = arr.slice();
    const valid = (v) => v > 40 && !Number.isNaN(v);
    let lastValid = -1;
    for (let i = 0; i < out.length; i++) {
      if (valid(out[i])) {
        if (lastValid >= 0 && i - lastValid > 1 && i - lastValid <= this.interpMaxGap) {
          const v0 = out[lastValid], v1 = out[i];
          for (let k = lastValid + 1; k < i; k++) {
            out[k] = v0 + ((v1 - v0) * (k - lastValid)) / (i - lastValid);
          }
        }
        lastValid = i;
      }
    }
    return out;
  }

  /* --- drawing primitives ------------------------------------------------- */
  hline(x1, x2, y, w, color) {
    this.ctx.beginPath();
    const r = 0.5 * w;
    this.ctx.moveTo(Math.round(x1), Math.round(y - r) + r);
    this.ctx.lineTo(Math.round(x2), Math.round(y - r) + r);
    this.ctx.lineWidth = w;
    this.ctx.strokeStyle = color;
    this.ctx.stroke();
  }

  vline(x, y1, y2, w, color) {
    this.ctx.beginPath();
    const r = 0.5 * w;
    this.ctx.moveTo(Math.round(x - r) + r, Math.round(y1));
    this.ctx.lineTo(Math.round(x - r) + r, Math.round(y2));
    this.ctx.lineWidth = w;
    this.ctx.strokeStyle = color;
    this.ctx.stroke();
  }

  drawAxes() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.TotalWidth, this.TotalHeight);
    // pure white paper, on screen and in print alike
    ctx.fillStyle = PAPER_COLOR;
    ctx.fillRect(0, 0, this.TotalWidth, this.TotalHeight);

    ctx.font = '18px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const textheight = 22;

    // central "safe"/normal FHR band (default 110..160 bpm, configurable)
    const span = this.signals.maxRCF - this.signals.minRCF;
    const yA = this.BorderTop + ((this.signals.maxRCF - this.signals.safeMax) / span) * this.RCFHeight;
    const yB = this.BorderTop + ((this.signals.maxRCF - this.signals.safeMin) / span) * this.RCFHeight;
    ctx.fillStyle = SAFE_BAND_COLOR;
    ctx.fillRect(this.BorderLeft, yA, this.graphWidth, yB - yA);

    // vertical time lines
    for (let j = 0; j <= ((this.winlength + 60) * (1 + this.is3cm * 2)) / 30; j++) {
      const ty = (j * 30) / (1 + this.is3cm * 2) - (this.time % 60);
      const x = (ty * this.graphWidth) / this.winlength + this.BorderLeft;
      if (j % (2 + 4 * this.is3cm) === 0) {
        this.vline(x, this.BorderTop, this.BorderTop + this.RCFHeight, 2, GRID_COLOR);
        this.vline(x, this.BorderTop + this.RCFHeight + this.RCFTOCOSpace,
          this.BorderTop + this.graphHeight, 2, GRID_COLOR);
      } else if (this.fullGrid) {
        this.vline(x, this.BorderTop, this.BorderTop + this.RCFHeight, 1, GRID_COLOR);
        this.vline(x, this.BorderTop + this.RCFHeight + this.RCFTOCOSpace,
          this.BorderTop + this.graphHeight, 1, GRID_COLOR);
      }
    }

    // horizontal FHR lines (every 5 bpm); bold lines mark the safe-band edges.
    const nLines = Math.round(span / 5);
    const jSafeMax = Math.round((this.signals.maxRCF - this.signals.safeMax) / 5);
    const jSafeMin = Math.round((this.signals.maxRCF - this.signals.safeMin) / 5);
    for (let j = 0; j <= nLines; j++) {
      const ty = this.BorderTop + (j * 5 * this.RCFHeight) / span;
      const bold = j === jSafeMax || j === jSafeMin;
      if (this.fullGrid) {
        if (bold) this.hline(this.BorderLeft, this.BorderLeft + this.graphWidth, ty, 4, GRID_COLOR);
        else if (j % 2 === 0) this.hline(this.BorderLeft, this.BorderLeft + this.graphWidth, ty, 2, GRID_COLOR);
        else this.hline(this.BorderLeft, this.BorderLeft + this.graphWidth, ty, 1, GRID_COLOR);
      } else if (bold) this.hline(this.BorderLeft, this.BorderLeft + this.graphWidth, ty, 3, GRID_COLOR);
      else if (j % 2 === 0) this.hline(this.BorderLeft, this.BorderLeft + this.graphWidth, ty, 1, GRID_COLOR);
    }

    // FHR numeric labels (every 4th line) on a chip that hides the grid lines
    // behind the digits. The chip takes the colour of what it covers — white
    // paper, grey inside the safe band — so a label sitting on a band edge
    // (160 by default) is white above the edge and grey below it.
    for (let j = 2; j <= nLines; j += 4) {
      const ty = this.BorderTop + (j * 5 * this.RCFHeight) / span;
      if (this.fullGrid || j % 8 === 2) {
        const val = this.signals.maxRCF - 5 * j;
        for (let i = 600 - (this.time % 600); i < this.winlength; i += 600) {
          const text = val.toString();
          const textwidth = ctx.measureText(text).width + 4;
          const textx = this.BorderLeft + (i / this.winlength) * this.graphWidth - textwidth / 2;
          const texty = ty - textheight / 2;
          ctx.fillStyle = PAPER_COLOR;
          ctx.fillRect(textx, texty, textwidth, textheight);
          const chipTop = Math.max(texty, yA), chipBottom = Math.min(texty + textheight, yB);
          if (chipBottom > chipTop) {
            ctx.fillStyle = SAFE_BAND_COLOR;
            ctx.fillRect(textx, chipTop, textwidth, chipBottom - chipTop);
          }
          ctx.fillStyle = GRID_COLOR;
          ctx.fillText(text, textx + textwidth / 2, texty + textheight / 2);
        }
      }
    }

    // horizontal TOCO lines
    for (let j = 0; j <= 9; j++) {
      const ty = this.BorderTop + this.RCFHeight + this.RCFTOCOSpace + (j * 10 * this.TOCOHeight) / 100;
      if (this.fullGrid) {
        if (j === 8) this.hline(this.BorderLeft, this.BorderLeft + this.graphWidth, ty, 4, GRID_COLOR);
        else if (j % 2 === 0) this.hline(this.BorderLeft, this.BorderLeft + this.graphWidth, ty, 2, GRID_COLOR);
        else this.hline(this.BorderLeft, this.BorderLeft + this.graphWidth, ty, 1, GRID_COLOR);
      } else if (j === 8) this.hline(this.BorderLeft, this.BorderLeft + this.graphWidth, ty, 3, GRID_COLOR);
      else if (j % 2 === 0) this.hline(this.BorderLeft, this.BorderLeft + this.graphWidth, ty, 1, GRID_COLOR);
    }
    for (let j = 0; j <= 9; j += 2) {
      const ty = this.BorderTop + this.RCFHeight + this.RCFTOCOSpace + (j * 10 * this.TOCOHeight) / 100;
      if (this.fullGrid || j % 4 === 0) {
        for (let i = 600 - (this.time % 600); i < this.winlength; i += 600) {
          const text = (100 - 10 * j).toString();
          const textwidth = ctx.measureText(text).width + 4;
          const textx = this.BorderLeft + (i / this.winlength) * this.graphWidth - textwidth / 2;
          const texty = ty - textheight / 2;
          ctx.fillStyle = PAPER_COLOR;
          ctx.fillRect(textx, texty, textwidth, textheight);
          ctx.fillStyle = GRID_COLOR;
          ctx.fillText(text, textx + textwidth / 2, texty + textheight / 2);
        }
      }
    }

    // time-tick labels along the bottom (HHhMM)
    ctx.font = '14px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#000000';
    const t = new Date();
    const secGap = 600 / (1 + this.is3cm);
    const tz = this.tzOffset || 0; // seconds; 0 = UTC so an epoch-0 (anonymised) start reads 00:00
    const zoned = this._axisFormatter(); // null unless an IANA `timeZone` is set
    for (let i = 0; i < this.winlength / secGap; i++) {
      const textx = this.BorderLeft + ((secGap - (this.time % secGap) + i * secGap) / this.winlength) * this.graphWidth;
      const texty = this.TotalHeight - this.BorderBottom;
      t.setTime(((Math.floor(this.time / secGap + 1) + i) * secGap + (zoned ? 0 : tz)) * 1000);
      const text = zoned ? zoned(t) : ('00' + t.getUTCHours()).slice(-2) + 'h' + ('00' + t.getUTCMinutes()).slice(-2);
      ctx.fillText(text, textx, texty);
    }
    this.hline(this.BorderLeft, this.TotalWidth - this.BorderRight, this.TotalHeight - this.BorderBottom, 1, '#000000');
  }

  /**
   * `HHhMM` in the IANA `timeZone` (daylight-saving time included), or null
   * when no zone is set — the fixed `tzOffset` then applies. An unknown zone
   * name falls back to the offset rather than throwing in the middle of a redraw.
   */
  _axisFormatter() {
    if (!this.timeZone) return null;
    if (this._axisZone !== this.timeZone) {
      try {
        this._axisFmt = new Intl.DateTimeFormat('en-GB', { timeZone: this.timeZone, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
        this._axisZone = this.timeZone;
      } catch (e) { this.timeZone = null; return null; }
    }
    const fmt = this._axisFmt;
    return (d) => fmt.format(d).replace(':', 'h');
  }

  /* --- colored zones (periods) ------------------------------------------- */
  drawPeriods() {
    const s = this.signals;
    if (!s.Marks) return;
    const zeros = new Array(s.TOCO.length).fill(0);
    for (let i = 0; i < s.Marks.length; i++) {
      const m = s.Marks[i];
      if (!m || m[1][0] !== '$') continue;
      const type = m[1].substring(2, 5);
      const startSamp = m[0];
      const durSamp = parseInt(m[1].substring(6), 10);
      const S = this.BorderLeft + (startSamp / s.srate - (this.time - s.start)) / this.winlength * this.graphWidth;
      const W = (durSamp / s.srate) / this.winlength * this.graphWidth;
      if (type === 'CON') {
        if (!this.displayContractions) continue;
        this.ctx.fillStyle = '#99990033';
        this.fillSurface(s.TOCO, zeros, startSamp, startSamp + durSamp, 0);
      } else if (type === 'ACC') {
        if (!this.displayMorpho) continue;
        this.ctx.fillStyle = '#00FF0033';
        this.fillSurface(this._baselineFor(s), s.RCFi.length ? s.baselineRCF : this._baselineFor(s),
          startSamp, startSamp + durSamp, 1, s.RCFi.length ? s.RCFi : s.RCF1);
      } else if (type === 'DEC') {
        if (!this.displayMorpho) continue;
        this.ctx.fillStyle = '#FF000033';
        this.fillSurface(this._baselineFor(s), s.RCFi.length ? s.baselineRCF : this._baselineFor(s),
          startSamp, startSamp + durSamp, 1, s.RCFi.length ? s.RCFi : s.RCF1);
      }
      // Note: false signals (URS/NTA) are NOT drawn as a column here — their
      // samples are recoloured lighter in drawSigFast (FHRMA-toolbox style).
    }
  }

  // For 6/8-byte files there is no server baseline; fall back to a flat band.
  _baselineFor(s) {
    if (s.baselineRCF.length) return s.baselineRCF;
    if (!this._flatBaseline || this._flatBaseline.length !== s.RCF1.length) {
      this._flatBaseline = new Array(s.RCF1.length).fill(140);
    }
    return this._flatBaseline;
  }

  fillSurface(Top, Bottom, S, E, isRCF, TopOverride) {
    const top = TopOverride || Top;
    this.ctx.beginPath();
    const s = this.signals;
    const d = Math.round((this.time - s.start) * s.srate);
    let M2, H, T, M1;
    if (isRCF) { M2 = s.maxRCF; H = this.RCFHeight; T = this.BorderTop; M1 = s.minRCF; }
    else { M2 = s.maxTOCO; H = this.TOCOHeight; T = this.BorderTop + this.RCFHeight + this.RCFTOCOSpace; M1 = s.minTOCO; }

    if (E > d && S < d + this.winlength * s.srate) {
      let firstTime = true;
      for (let i = Math.round(Math.max(S - d, 0, -d)); i < Math.min(E - d, top.length - d - 1); i++) {
        const x1 = this.BorderLeft + (i * this.graphWidth) / (s.srate * this.winlength);
        const y1 = T + (H * (M2 - top[d + i])) / (M2 - M1);
        if (firstTime) { firstTime = false; this.ctx.moveTo(x1, y1); } else this.ctx.lineTo(x1, y1);
      }
      for (let i = Math.round(Math.min(E - d, top.length - d - 1)); i >= Math.max(S - d, 0, -d); i--) {
        const x1 = this.BorderLeft + (i * this.graphWidth) / (s.srate * this.winlength);
        const y1 = T + (H * (M2 - Bottom[d + i])) / (M2 - M1);
        this.ctx.lineTo(x1, y1);
      }
    }
    this.ctx.closePath();
    this.ctx.fill();
  }

  /* --- signal curves ------------------------------------------------------ */
  drawSigFast() {
    const s = this.signals;
    if (s.start < 0 || s.RCF1.length === 0) return;
    const d = Math.round((this.time - s.start) * s.srate);
    const channels = this._activeChannels();
    const falseMask = this._falseMask();
    const showFalse = this.displayFalseSignals;

    for (const ch of channels) {
      const arr = this._maybeInterpolate(ch.arr);
      // Only the analysed fetal channel carries the false-signal mask (NOT the
      // maternal MHR, which is the reference, nor the computed FHRi/baseline).
      const canFalse = ch.name === this.falseSignalChannel;
      this.ctx.lineWidth = 1;
      let started = false, curColor = null, lastX = 0, lastY = 0, haveLast = false;
      const flush = () => { if (started) { this.ctx.stroke(); started = false; } };
      for (let k = 0; k <= this.winlength * s.srate; k += 4) {
        const idx = d + k;
        const v = arr[idx];
        const ok = v > 40 && !Number.isNaN(v)
          && (this.interpolate
            || (arr[idx - 1] > 40 && arr[idx - 2] > 40 && arr[idx - 3] > 40));
        if (!ok) { flush(); haveLast = false; continue; }
        const isFalse = canFalse && falseMask[idx] === 1;
        if (isFalse && !showFalse) { flush(); haveLast = false; continue; } // hidden
        const color = isFalse ? (ch.light || ch.color) : ch.color;
        const x1 = this.BorderLeft + (k * this.graphWidth) / (s.srate * this.winlength);
        const y1 = this.BorderTop + (this.RCFHeight * (s.maxRCF - v)) / (s.maxRCF - s.minRCF);
        if (!started || color !== curColor) {
          flush();
          this.ctx.beginPath();
          this.ctx.strokeStyle = color;
          curColor = color;
          this.ctx.moveTo(haveLast ? lastX : x1, haveLast ? lastY : y1);
          this.ctx.lineTo(x1, y1);
          started = true;
        } else {
          this.ctx.lineTo(x1, y1);
        }
        lastX = x1; lastY = y1; haveLast = true;
      }
      flush();
    }

    // TOCO (filled to baseline + line)
    if (this.viewer.channelVisible.TOCO !== false) {
      let y0 = NaN;
      this.ctx.beginPath();
      this.ctx.strokeStyle = DEFAULT_COLORS.TOCO;
      const toco = this._displayArray('TOCO', s.TOCO);
      for (let k = 0; k <= this.winlength * s.srate; k += 4) {
        const x1 = this.BorderLeft + (k * this.graphWidth) / (s.srate * this.winlength);
        const v = toco[d + k];
        if (!Number.isNaN(v) && v !== undefined) {
          const y1 = this.BorderTop + this.RCFHeight + this.RCFTOCOSpace
            + (this.TOCOHeight * (s.maxTOCO - v)) / (s.maxTOCO - s.minTOCO);
          if (!Number.isNaN(y0)) this.ctx.lineTo(x1, y1); else this.ctx.moveTo(x1, y1);
          y0 = y1;
        } else y0 = NaN;
      }
      this.ctx.stroke();
    }
  }

  /* --- markers ------------------------------------------------------------ */
  intersectRect(r1, r2) {
    return !((r2.x > r1.x + r1.w || r2.x + r2.w < r1.x) || (r2.y > r1.y + r1.h || r2.y + r2.h < r1.y));
  }

  drawMarks() {
    const s = this.signals;
    this.markRects = [];
    if (!this.displayMarks) return;   // marker show/hide toggle
    const all = [{ x: this.graphWidth - 200, y: this.BorderTop, w: 200, h: 21 }];
    this.ctx.font = '16px Arial';
    this.ctx.textAlign = 'left';
    this.ctx.textBaseline = 'top';
    if (!s.Marks) return;
    for (let i = 0; i < s.Marks.length; i++) {
      const m = s.Marks[i];
      // `$` zones are painted by drawPeriods; `§` lines are protected metadata
      // (device model, serial number…) and are never drawn.
      if (!m || m[1][0] === '$' || m[1][0] === '§') continue;
      const tmpx0 = m[0] / s.srate - (this.time - s.start);
      const tmpx = this.BorderLeft + (tmpx0 / this.winlength) * this.graphWidth;
      // `£!` = protected alert (device failure), red; `£` = protected, blue; else a free event.
      const color = m[1].startsWith('£!') ? ALERT_MARK_COLOR : m[1][0] === '£' ? PROTECTED_MARK_COLOR : MARK_COLOR;
      this.ctx.fillStyle = color;
      const dtext = m[1].replace(/^£!?/, '');
      const texts = dtext.split('\r');
      for (let k = 0; k < texts.length; k++) {
        let j = 0;
        const rect = { x: tmpx + 3, y: this.BorderTop, w: this.ctx.measureText(texts[k]).width, h: 17 };
        while (j < all.length) {
          if (this.intersectRect(rect, all[j])) { rect.y += 5; j = 0; } else j++;
        }
        all.push(rect);
        if (k === 0) {
          if (tmpx0 > 0 && tmpx0 < this.winlength) this.vline(tmpx, rect.y, this.BorderTop + this.graphHeight, 1, color);
          this.markRects.push(rect);
        }
        if (i !== this.editingMark && tmpx0 > 0 && tmpx0 < this.winlength) {
          this.ctx.fillText(texts[k], tmpx + 3, rect.y);
        }
      }
    }
  }

  /* --- measurer / new-mark tools (SVG overlay) --------------------------- */
  removeMouseMode() {
    if (this.mouseMode === 'Measurer1' || this.mouseMode === 'Measurer2') {
      this._svgRemove(this.measurer.hline, this.measurer.vline, this.measurer.textY);
      if (this.mouseMode === 'Measurer2') {
        this._svgRemove(this.measurer.hline2, this.measurer.vline2, this.measurer.textDY, this.measurer.textDX);
      }
    } else if (this.mouseMode === 'NewMarkPostioning') {
      this._svgRemove(this.newMark.vline, this.newMark.textEvent);
    }
    this.mouseMode = 'None';
    this.container.style.cursor = 'pointer';
  }

  _svgRemove(...els) { for (const el of els) if (el && el.parentNode) el.parentNode.removeChild(el); }

  _svgLine(x1, y1, x2, y2, stroke) {
    const l = document.createElementNS(SVGNS, 'line');
    l.setAttributeNS(null, 'x1', x1); l.setAttributeNS(null, 'y1', y1);
    l.setAttributeNS(null, 'x2', x2); l.setAttributeNS(null, 'y2', y2);
    l.setAttributeNS(null, 'stroke', stroke); l.style.strokeWidth = 1;
    this.svg.appendChild(l); return l;
  }

  _svgText(x, y) {
    const t = document.createElementNS(SVGNS, 'text');
    if (x !== undefined) t.setAttributeNS(null, 'x', x);
    if (y !== undefined) t.setAttributeNS(null, 'y', y);
    t.setAttributeNS(null, 'font-size', 16);
    t.setAttributeNS(null, 'font-weight', 'bold');
    this.svg.appendChild(t); return t;
  }

  _svgAttr(el, attrs) { for (const k in attrs) el.setAttributeNS(null, k, attrs[k]); }

  /* --- reference cursor: crosshair + 30 bpm x 15 s box (ported from v2) ---- */
  initializeBox1515() {
    this.clearBox1515();
    this.box1515.hline = this._svgLine(this.BorderLeft, -100, this.graphWidth + this.BorderLeft, -100, '#555');
    this.box1515.vline = this._svgLine(-100, this.BorderTop, -100, this.BorderTop + this.graphHeight, '#555');
    const r = document.createElementNS(SVGNS, 'rect');
    r.setAttributeNS(null, 'fill', 'none');
    r.setAttributeNS(null, 'stroke', '#555');
    this.svg.appendChild(r);
    this.box1515.rect = r;
  }

  clearBox1515() {
    this._svgRemove(this.box1515.hline, this.box1515.vline, this.box1515.rect);
    this.box1515 = {};
  }

  initializeMeasurer() {
    this.clearBox1515();
    this.measurer.hline = this._svgLine(this.BorderLeft, -100, this.graphWidth + this.BorderLeft, -100, 'black');
    this.measurer.textY = this._svgText(this.BorderLeft + 5, undefined);
    this.measurer.vline = this._svgLine(-100, this.BorderTop, -100, this.BorderTop + this.graphHeight, 'black');
    this.mouseMode = 'Measurer1';
    this.container.style.cursor = 'auto';
  }

  initializeMeasurer2() {
    this.measurer.hline2 = this._svgLine(this.BorderLeft, -100, this.graphWidth + this.BorderLeft, -100, 'black');
    this.measurer.textDY = this._svgText();
    this.measurer.vline2 = this._svgLine(-100, this.BorderTop, -100, this.BorderTop + this.graphHeight, 'black');
    this.measurer.textDX = this._svgText();
    this.mouseMode = 'Measurer2';
  }

  initializeNewMark(defaultText) {
    this.clearBox1515();
    const color = (defaultText === 'Question' || (defaultText.length > 0 && defaultText[0] === '£')) ? PROTECTED_MARK_COLOR : MARK_COLOR;
    this.newMark.textEvent = this._svgText(0, this.BorderTop + 17);
    this.newMark.textEvent.setAttributeNS(null, 'fill', color);
    this.newMark.textEvent.textContent = defaultText;
    this.newMark.vline = this._svgLine(-100, this.BorderTop, -100, this.BorderTop + this.graphHeight, color);
    this.mouseMode = 'NewMarkPostioning';
    this.container.style.cursor = 'text';
  }

  newMarkEdit(shifted) {
    const s = this.signals;
    const x1 = parseFloat(this.newMark.vline.getAttributeNS(null, 'x1'));
    const text = this.newMark.textEvent.textContent;
    const samp = ((x1 / this.graphWidth) * this.winlength + this.time - s.start) * s.srate;
    this.removeMouseMode();
    if (text === 'Question') {
      this.viewer._emit('question', { seconds: Math.round(samp / 4), epoch: s.start + samp / 4 });
      s.addMarks(samp, '£Question');
      this.redraw();
      this.viewer._markersChanged();
    } else {
      this.editingMark = s.addMarks(samp, text);
      s.editingMark = true;
      this._editingOriginal = text;   // what Escape restores ('' = the new mark goes away)
      this.redraw();
      let tmpx = s.Marks[this.editingMark][0] / s.srate - (this.time - s.start);
      tmpx = this.BorderLeft + (tmpx / this.winlength) * this.graphWidth;
      this.eventTextEdit.style.left = `${tmpx + 3}px`;
      this.eventTextEdit.style.top = '2px';
      this.eventTextEdit.style.display = 'block';
      this.eventTextEdit.value = s.Marks[this.editingMark][1];
      setTimeout(() => { this.eventTextEdit.focus(); this.eventTextEdit.select(); }, 0);
      if (text !== '') this.validateMark(shifted);
    }
  }

  validateMark(shifted = false) {
    const s = this.signals;
    if (this.editingMark === -1) return;   // a blur after a validation must not touch the marks
    // The edit is closed BEFORE the field is hidden: the blur fired by the hiding must not re-enter.
    const n = this.editingMark;
    this.editingMark = -1;
    s.editingMark = false;
    // A line break typed in the field becomes the format's internal `\r`
    // (display line break): `\n` is the line separator of the marker file.
    s.updateMark(n, this.eventTextEdit.value.replace(/\r?\n/g, '\r'));
    this.eventTextEdit.style.display = 'none';
    this.redraw();
    this.viewer._markersChanged();
    if (shifted) setTimeout(() => this.initializeNewMark(this.eventTextEdit.value), 0);
  }

  /** Escape: the text goes back to what it was; a mark just created is removed. Nothing is emitted. */
  cancelMark() {
    const s = this.signals;
    if (this.editingMark === -1) return;
    const n = this.editingMark;
    this.editingMark = -1;
    s.editingMark = false;
    s.updateMark(n, this._editingOriginal || '');
    this.eventTextEdit.style.display = 'none';
    this.redraw();
  }

  checkEditable(x, y) {
    const s = this.signals;
    for (let i = 0; i < this.markRects.length && this.editingMark === -1; i++) {
      const r = this.markRects[i];
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
        let n = -1;
        // markRects only lists the drawn marks: skip the `$` zones and the hidden `§` metadata.
        for (let j = 0; j <= i; j++) { n++; while (s.Marks[n][1][0] === '$' || s.Marks[n][1][0] === '§') n++; }
        if (s.Marks[n][1][0] !== '£') {
          this.editingMark = n;
          s.editingMark = true;
          this._editingOriginal = s.Marks[n][1];
          this.redraw();
          this.eventTextEdit.style.left = `${r.x + 2}px`;
          this.eventTextEdit.style.top = `${r.y + 2}px`;
          this.eventTextEdit.style.display = 'block';
          this.eventTextEdit.value = s.Marks[n][1];
          setTimeout(() => { this.eventTextEdit.focus(); this.eventTextEdit.select(); }, 0);
          return true;
        }
      }
    }
    return false;
  }

  mouseMove(event) {
    const rect = this.canvas.getBoundingClientRect();
    const mousex = Math.round(event.clientX - rect.left - 0.5) + 0.5;
    const mousey = Math.round(event.clientY - rect.top - 0.5) + 0.5;
    if (this.mouseMode === 'Measurer1') {
      this.measurer.hline.setAttributeNS(null, 'y1', mousey);
      this.measurer.hline.setAttributeNS(null, 'y2', mousey);
      this.measurer.vline.setAttributeNS(null, 'x1', mousex);
      this.measurer.vline.setAttributeNS(null, 'x2', mousex);
      this.measurer.textY.setAttributeNS(null, 'y', mousey - 5);
      if (mousey < this.RCFHeight + this.RCFTOCOSpace) {
        this.measurer.Y1 = ((this.RCFHeight - mousey) / this.RCFHeight)
          * (this.signals.maxRCF - this.signals.minRCF) + this.signals.minRCF;
        this.measurer.textY.textContent = `${this.measurer.Y1.toFixed(1)} bpm`;
      } else {
        this.measurer.Y1 = -((this.graphHeight - mousey) / this.TOCOHeight) * 100;
        this.measurer.textY.textContent = Math.round(-this.measurer.Y1);
      }
      this.measurer.T1 = (mousex / this.graphWidth) * this.winlength + this.time;
    } else if (this.mouseMode === 'Measurer2') {
      this.measurer.hline2.setAttributeNS(null, 'y1', mousey);
      this.measurer.hline2.setAttributeNS(null, 'y2', mousey);
      this.measurer.vline2.setAttributeNS(null, 'x1', mousex);
      this.measurer.vline2.setAttributeNS(null, 'x2', mousex);
      this.measurer.textDY.setAttributeNS(null, 'y', mousey - 5);
      this.measurer.textDY.setAttributeNS(null, 'x', mousex + 30);
      this.measurer.textDX.setAttributeNS(null, 'y', 20);
      this.measurer.textDX.setAttributeNS(null, 'x', mousex + 5);
      if (this.measurer.Y1 > 0) {
        this.measurer.textDY.textContent = `${Math.abs(((this.RCFHeight - mousey) / this.RCFHeight)
          * (this.signals.maxRCF - this.signals.minRCF) + this.signals.minRCF - this.measurer.Y1).toFixed(1)} bpm`;
      } else {
        this.measurer.textDY.textContent = Math.abs(Math.round(((this.graphHeight - mousey) / this.TOCOHeight) * 100 + this.measurer.Y1));
      }
      const dt = Math.abs((mousex / this.graphWidth) * this.winlength + this.time - this.measurer.T1);
      let sec = `${Math.round(dt % 60)}`;
      if (sec.length === 1) sec = `0${sec}`;
      this.measurer.textDX.textContent = `${Math.floor(dt / 60)}min${sec}`;
    } else if (this.mouseMode === 'NewMarkPostioning') {
      this.newMark.vline.setAttributeNS(null, 'x1', mousex);
      this.newMark.vline.setAttributeNS(null, 'x2', mousex);
      this.newMark.textEvent.setAttributeNS(null, 'x', mousex + 5);
    } else {
      // 'None' (default): reference cursor = crosshair + a 30 bpm x 15 s box
      // anchored at the pointer, to gauge amplitude/variability at a glance.
      if (!this.box1515.rect) this.initializeBox1515();
      const size15 = (this.RCFHeight * 15) / (this.signals.maxRCF - this.signals.minRCF);
      this._svgAttr(this.box1515.hline, {
        x1: this.BorderLeft, y1: mousey, x2: this.graphWidth + this.BorderLeft, y2: mousey,
      });
      this._svgAttr(this.box1515.vline, {
        x1: mousex, y1: this.BorderTop, x2: mousex, y2: this.BorderTop + this.graphHeight,
      });
      this._svgAttr(this.box1515.rect, {
        x: mousex, y: mousey - size15, height: 2 * size15,
        width: (15 / this.winlength) * this.graphWidth,
      });
    }
  }

  /* --- master redraw ------------------------------------------------------ */
  redraw() {
    this.resize();
    this.drawAxes();
    this.drawPeriods();
    this.drawSigFast();
    this.drawMarks();
  }
}

/* ----------------------------------------------------------------------------
 * FHRViewer — public, host-driveable controller.
