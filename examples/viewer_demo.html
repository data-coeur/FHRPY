// [name, label/icon-key, tooltip, isIcon]
const BUTTONS = [
  ['previouspage', 'previouspage', 'Previous page', true],
  ['nextpage', 'nextpage', 'Next page', true],
  ['measure', 'measure', 'Measure (ruler): click to set a point, click again for a second one', true],
  ['addevent', 'addevent', 'Add an event marker', true],
  ['scale', '3cm<br>/min', 'Toggle paper speed: 1 / 3 cm per minute', false],
  ['baseline', 'baseline', 'Show / hide the baseline + acceleration / deceleration zones', true],
  ['contractions', 'contractions', 'Show / hide detected contraction (TOCO) zones', true],
  ['falsesignals', 'falsesignals', 'Show / hide false signals (FHR/MHR confusion, lighter samples)', true],
  ['markers', 'markers', 'Show / hide the text markers (events, deceleration types)', true],
  ['mhr', 'MHR', 'Show / hide the maternal heart rate (MHR)', false],
  ['interpolate', 'interpolate', 'Interpolate missing points (bridge gaps)', true],
  ['print', 'print', 'Print to PDF (A4 landscape, ~1 cm/min, multi-page)', true],
];

class FHRViewer {
  /**
   * @param {HTMLElement|string} host host element or selector
   * @param {Object} [opts]
   *   height, scale (cm/min: 1 or 3), channels (array of channel names),
   *   signalsPerGraph (number), interpolate (bool), zones (bool),
   *   contractions (bool), falseSignals (bool), range ([min, max] bpm),
   *   safeZone ([min, max] bpm), tzOffset (seconds) or timeZone (IANA name),
   *   labels ({name: tooltip, 'name.text': caption} to translate the toolbar),
   *   delays ({doppler, scalp, mecg, mhrToco, mhrOximeter, toco} seconds),
   *   follow (bool: keep the view locked on the live end of the recording),
   *   bytesPerSample (6 | 8 | 12; else implied by the extension),
   *   headerBytes (4 | 8; else auto-detected),
   *   onMessage (function for the postMessage bridge fallback).
   */
  constructor(host, opts = {}) {
    this.host = typeof host === 'string' ? document.querySelector(host) : host;
    this.opts = opts;
    this._listeners = {};
    this.channelVisible = { FHR1: true, FHR2: true, MHR: true, FHRi: true, baseline: true, TOCO: true };
    this._messageSink = opts.onMessage || null;

    this._buildDOM();
    this.graph = new GraphPlot(this.graphEl, this);
    this.scrollBar = new ScrollBar(this.scrollTrack, (v, fast) => this._onScroll(v, fast, true));

    // apply options
    if (Array.isArray(opts.channels)) this.graph.channels = opts.channels.slice();
    else if (typeof opts.signalsPerGraph === 'number') {
      this.graph.channels = ['FHRi', 'FHR1', 'FHR2', 'MHR'].slice(0, opts.signalsPerGraph);
    }
    if (typeof opts.tzOffset === 'number') this.graph.tzOffset = opts.tzOffset;
    if (typeof opts.timeZone === 'string' && opts.timeZone) this.graph.timeZone = opts.timeZone;
    if (typeof opts.falseSignalChannel === 'string') this.graph.falseSignalChannel = opts.falseSignalChannel;
    if (opts.scale === 3) this.graph.is3cm = 1;
    if (opts.interpolate) this.graph.interpolate = true;
    if (opts.zones === false) this.graph.displayMorpho = false;
    if (opts.contractions === false) this.graph.displayContractions = false;
    if (opts.falseSignals === false) this.graph.displayFalseSignals = false;
    if (Array.isArray(opts.range) && opts.range.length === 2) {
      this.graph.signals.minRCF = Number(opts.range[0]);
      this.graph.signals.maxRCF = Number(opts.range[1]);
    }
    if (Array.isArray(opts.safeZone) && opts.safeZone.length === 2) {
      this.graph.signals.safeMin = Number(opts.safeZone[0]);
      this.graph.signals.safeMax = Number(opts.safeZone[1]);
    }
    if (opts.delays && typeof opts.delays === 'object') this.graph.delays = { ...opts.delays };
    const layout = this.graph.signals.layout;
    if ([6, 8, 12].includes(opts.bytesPerSample)) layout.bytesPerSample = opts.bytesPerSample;
    if (opts.headerBytes === 4 || opts.headerBytes === 8) layout.headerBytes = opts.headerBytes;
    this._follow = !!opts.follow;
    this._btn.follow.classList.toggle('active', this._follow);

    this._wireEvents();

    if (typeof opts.height === 'number') this.setHeight(opts.height);

    // responsive width
    if (typeof ResizeObserver !== 'undefined') {
      this._ro = new ResizeObserver(() => {
        this._snapToLiveEnd();
        if (this.graph.signals.start >= 0) this.graph.redraw();
        this._updateScrollBar();
      });
      this._ro.observe(this.graphEl);
    }
  }

  /* --- DOM ---------------------------------------------------------------- */
  _buildDOM() {
    this.host.classList.add('fhr-viewer');
    this.host.innerHTML = '';

    this.graphEl = document.createElement('div');
    this.graphEl.className = 'graph';
    const canvas = document.createElement('canvas');
    canvas.className = 'background-canvas';
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('class', 'frontground-svg');
    this.graphEl.append(canvas, svg);

    const controllers = document.createElement('div');
    controllers.className = 'controllers';

    // `opts.labels` lets the host translate the toolbar: {name: 'tooltip'}
    // overrides a tooltip, {'name.text': 'caption'} the caption of a text
    // button, `resizebar` the tooltip of the drag handle.
    const L = this.opts.labels || {};

    // Scrollbar gets its own full-width row, on top: the track, then the
    // "follow live" control at its right end...
    this.scrollEl = document.createElement('div');
    this.scrollEl.className = 'fhr-viewer-scrollbar';
    this.scrollTrack = document.createElement('div');
    this.scrollTrack.className = 'scrollbarTrack';
    const follow = document.createElement('button');
    follow.type = 'button';
    follow.className = 'btn-fhr-icons btn-follow icon';
    follow.title = L.follow || 'Follow live: keep the view on the end of the recording as it grows (click again to release)';
    follow.innerHTML = ICONS.follow;
    this.scrollEl.append(this.scrollTrack, follow);
    this._btn = { follow };

    // ...and the icon buttons sit on the row below it (no overlap).
    const icons = document.createElement('div');
    icons.className = 'controller-icons';
    for (const [name, label, title, isIcon] of BUTTONS) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = `btn-fhr-icons btn-${name}` + (isIcon ? ' icon' : ' text');
      b.title = L[name] || title;        // native tooltip on hover for every button
      b.innerHTML = isIcon ? (ICONS[label] || '') : (L[name + '.text'] || label);
      icons.appendChild(b);
      this._btn[name] = b;
    }
    controllers.append(this.scrollEl, icons);
    // The MHR toggle wears the colour of the MHR curve and a "−" / "+" prefix
    // that says what the next click does (hide / show).
    this._btn.mhr.style.color = DEFAULT_COLORS.MHR;
    this._mhrCaption = L['mhr.text'] || 'MHR';

    // bottom drag handle to resize the viewer height (re-added; syncs the iframe)
    this.resizebar = document.createElement('div');
    this.resizebar.className = 'resizebar';
    this.resizebar.title = L.resizebar || 'Drag to resize the viewer height';

    this.host.append(this.graphEl, controllers, this.resizebar);

    // reflect initial toggle states
    if (this.opts.zones !== false) this._btn.baseline.classList.add('active');
    if (this.opts.contractions !== false) this._btn.contractions.classList.add('active');
    if (this.opts.falseSignals !== false) this._btn.falsesignals.classList.add('active');
    if (this.opts.scale === 3) this._btn.scale.classList.add('active');
    if (this.opts.interpolate) this._btn.interpolate.classList.add('active');
    this._btn.markers.classList.add('active');
    this._renderMhrButton();
  }

  _renderMhrButton() {
    const on = this.channelVisible.MHR !== false;
    this._btn.mhr.classList.toggle('active', on);
    this._btn.mhr.innerHTML = (on ? '− ' : '+ ') + this._mhrCaption;
  }

  _wireEvents() {
    this._btn.previouspage.addEventListener('click', () => { this.previouspage(); this._emit('button:prevpage', {}); });
    this._btn.nextpage.addEventListener('click', () => { this.nextpage(); this._emit('button:nextpage', {}); });
    this._btn.measure.addEventListener('click', () => { this._toggleMouseMode('measure'); this._emit('button:measure', {}); });
    this._btn.addevent.addEventListener('click', () => { this._toggleMouseMode('event'); this._emit('button:addevent', {}); });
    this._btn.scale.addEventListener('click', () => { this.toggle3cm(); this._emit('button:scale', { is3cm: this.graph.is3cm }); });
    this._btn.baseline.addEventListener('click', () => { this.setZonesVisible(!this.graph.displayMorpho); this._emit('button:baseline', { on: this.graph.displayMorpho }); });
    this._btn.contractions.addEventListener('click', () => { this.setContractionsVisible(!this.graph.displayContractions); this._emit('button:contractions', { on: this.graph.displayContractions }); });
    this._btn.falsesignals.addEventListener('click', () => { this.setFalseSignalsVisible(!this.graph.displayFalseSignals); this._emit('button:falsesignals', { on: this.graph.displayFalseSignals }); });
    this._btn.markers.addEventListener('click', () => { this.setMarksVisible(!this.graph.displayMarks); this._emit('button:markers', { on: this.graph.displayMarks }); });
    this._btn.mhr.addEventListener('click', () => { this.setChannelVisible('MHR', this.channelVisible.MHR === false); this._emit('button:mhr', { on: this.channelVisible.MHR }); });
    this._btn.interpolate.addEventListener('click', () => { this.setInterpolate(!this.graph.interpolate); this._emit('button:interpolate', { on: this.graph.interpolate }); });
    this._btn.print.addEventListener('click', () => { this.print(); this._emit('button:print', {}); });
    this._btn.follow.addEventListener('click', () => { this.setFollow(!this._follow); this._emit('button:follow', { on: this._follow }); });

    // bottom resize handle
    this.resizebar.addEventListener('mousedown', (e) => this._resizeDown(e));

    // graph drag-to-pan + click (measure / new mark / edit)
    this._panState = null;
    this.graphEl.addEventListener('mousedown', (e) => this._graphMouseDown(e));

    // mouse-wheel scrolling with inertia (momentum) — works under VSCode/Colab.
    this.graphEl.addEventListener('wheel', (e) => this._onWheel(e), { passive: false });
  }

  /* --- mouse-wheel scroll with momentum ----------------------------------- */
  _onWheel(e) {
    const g = this.graph, s = g.signals;
    if (s.start < 0 || !g.winlength) return;
    e.preventDefault();
    // A wheel notch nudges time; deltaX (trackpads) contributes too.
    const secPerPx = g.winlength / Math.max(g.graphWidth, 1);
    const delta = (e.deltaY + e.deltaX) * (e.deltaMode === 1 ? 16 : 1);
    this._wheelVel = (this._wheelVel || 0) + delta * secPerPx * 0.35;
    if (!this._wheelRAF) this._wheelStep();
  }

  _wheelStep() {
    const g = this.graph, s = g.signals;
    this._wheelVel *= 0.88;                       // momentum decay
    if (Math.abs(this._wheelVel) < 0.04) { this._wheelVel = 0; this._wheelRAF = null; return; }
    const tmax = s.lastTime - g.winlength + 120;
    let t = g.time + this._wheelVel;
    if (t > tmax) { t = tmax; this._wheelVel = 0; }
    if (t < s.start) { t = s.start; this._wheelVel = 0; }
    g.time = t;
    g.redraw();
    this._updateScrollBar();
    this._afterUserScroll();
    this._emit('scroll', { time: g.time });
    this._wheelRAF = (typeof requestAnimationFrame !== 'undefined')
      ? requestAnimationFrame(() => this._wheelStep()) : null;
  }

  /* --- scroll / paging ---------------------------------------------------- */
  _onScroll(v, fast, byUser = false) {
    const g = this.graph, s = g.signals;
    const sigLength = s.lastTime - s.start;
    g.time = Math.max(v * (sigLength - g.winlength + 120), 0) + s.start;
    g.redraw();
    if (byUser) this._afterUserScroll();
    this._emit('scroll', { time: g.time, value: v });
  }

  _updateScrollBar() {
    const g = this.graph, s = g.signals;
    if (s.start < 0 || !g.winlength) return;
    this.scrollBar.setPageRatio(g.winlength / (s.lastTime - s.start + 120));
    this.scrollBar.setValue((g.time - s.start) / (s.lastTime - s.start - g.winlength + 120), false);
  }

  /* --- follow live: keep the view locked on the end of the recording ------- */
  /** Time of the rightmost view: the last sample plus the 2-minute blank tail the viewer always allows. */
  _liveEnd() {
    const g = this.graph, s = g.signals;
    if (s.start < 0) return 0;
    return Math.max(s.start, s.lastTime - (g.winlength || 0) + 120);
  }

  /** While following, a change of geometry (height, width, paper speed) keeps the live end in view. */
  _snapToLiveEnd() {
    const g = this.graph;
    if (!this._follow || g.signals.start < 0) return;
    g.resize();
    g.time = this._liveEnd();
  }

  /** After a navigation by the user: following stays on only while the view sits at the live end. */
  _afterUserScroll() {
    const g = this.graph, s = g.signals;
    if (s.start < 0) return;
    const atEnd = g.time >= this._liveEnd() - 0.5;
    // A recording shorter than the window is always "at the live end": paging it
    // must not ARM following by itself — only an explicit setFollow() may.
    const fits = s.lastTime - s.start + 120 <= g.winlength;
    const on = atEnd && (this._follow || !fits);
    if (on === this._follow) return;
    this._follow = on;
    this._btn.follow.classList.toggle('active', on);
    this._emit('followChange', { on });
  }

  nextpage() {
    const g = this.graph, s = g.signals;
    let t = g.time + g.winlength - 60;
    const tmax = s.lastTime - g.winlength + 120;
    if (t > tmax) t = tmax;
    g.time = Math.max(t, s.start);
    g.redraw();
    this._updateScrollBar();
    this._afterUserScroll();
    this._emit('scroll', { time: g.time });
  }

  previouspage() {
    const g = this.graph, s = g.signals;
    let t = g.time - g.winlength + 60;
    if (t < s.start) t = s.start;
    g.time = t;
    g.redraw();
    this._updateScrollBar();
    this._afterUserScroll();
    this._emit('scroll', { time: g.time });
  }

  /* --- mouse interactions ------------------------------------------------- */
  _toggleMouseMode(kind) {
    const g = this.graph;
    const prev = g.mouseMode;
    if (g.mouseMode !== 'None') {
      g.removeMouseMode();
      for (const n of ['measure', 'addevent']) this._btn[n].classList.remove('active');
    }
    if (kind === 'measure' && prev !== 'Measurer1' && prev !== 'Measurer2') {
      g.initializeMeasurer(); this._btn.measure.classList.add('active');
    } else if (kind === 'event' && prev !== 'NewMarkPostioning') {
      g.initializeNewMark(''); this._btn.addevent.classList.add('active');
    }
  }

  _graphMouseDown(e) {
    const g = this.graph;
    if (g.mouseMode === 'Measurer1') { g.initializeMeasurer2(); return; }
    if (g.mouseMode === 'Measurer2') { g.removeMouseMode(); g.initializeMeasurer(); return; }
    if (g.mouseMode === 'NewMarkPostioning') {
      this._btn.addevent.classList.remove('active');
      if (e.which >= 2) { g.removeMouseMode(); e.preventDefault(); return; }
      g.newMarkEdit(e.shiftKey);
      return;
    }
    // None: editing or pan
    if (g.editingMark !== -1) {
      const r = g.eventTextEdit.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) {
        g.validateMark(e.shiftKey);
      }
      return;
    }
    const rect = this.graphEl.getBoundingClientRect();
    if (g.checkEditable(e.clientX - rect.left, e.clientY - rect.top)) return;
    // start panning (stop any ongoing fling first)
    this._cancelFling();
    this._panState = { x0: e.clientX, t0: g.time };
    this._panVel = 0;
    this._panLast = { x: e.clientX, t: this._now() };
    this._panMove = (ev) => this._graphPan(ev);
    this._panUp = () => {
      document.removeEventListener('mousemove', this._panMove);
      document.removeEventListener('mouseup', this._panUp);
      this._panLast = null;
      this._startFling();   // grab-and-throw -> keep gliding with momentum
    };
    document.addEventListener('mousemove', this._panMove);
    document.addEventListener('mouseup', this._panUp);
  }

  _now() { return typeof performance !== 'undefined' ? performance.now() : 0; }

  _cancelFling() {
    if (this._flingRAF && typeof cancelAnimationFrame !== 'undefined') {
      cancelAnimationFrame(this._flingRAF);
    }
    this._flingRAF = null;
    this._panVel = 0;
  }

  /* --- bottom resize handle: drag to change the viewer height -------------- */
  _resizeDown(e) {
    e.preventDefault();
    const startH = this.host.clientHeight;
    const startY = e.clientY;
    const move = (ev) => this.setHeight(startH + (ev.clientY - startY));
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      this._emit('heightChange', { height: this.host.clientHeight });
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  }

  _graphPan(e) {
    const g = this.graph, s = g.signals;
    const secPerPx = g.winlength / Math.max(g.graphWidth, 1);
    const deltaX = e.clientX - this._panState.x0;
    let t = this._panState.t0 - secPerPx * deltaX;
    const tmax = s.lastTime - g.winlength + 120;
    if (t > tmax) t = tmax;
    if (t < s.start) t = s.start;
    g.time = t;
    // track instantaneous velocity (signal-seconds per ms) for the fling
    const now = this._now();
    if (this._panLast) {
      const dtMs = now - this._panLast.t;
      if (dtMs > 0) this._panVel = -secPerPx * (e.clientX - this._panLast.x) / dtMs;
    }
    this._panLast = { x: e.clientX, t: now };
    g.redraw();
    this._updateScrollBar();
    this._afterUserScroll();
    this._emit('scroll', { time: g.time });
  }

  _startFling() {
    const g = this.graph, s = g.signals;
    if (!this._panVel || Math.abs(this._panVel) < 0.003
        || typeof requestAnimationFrame === 'undefined') {
      this._panVel = 0;
      return;
    }
    let last = this._now();
    const step = () => {
      const now = this._now();
      const dt = Math.min(now - last, 50);
      last = now;
      g.time += this._panVel * dt;
      const tmax = s.lastTime - g.winlength + 120;
      if (g.time > tmax) { g.time = tmax; this._panVel = 0; }
      if (g.time < s.start) { g.time = s.start; this._panVel = 0; }
      g.redraw();
      this._updateScrollBar();
      this._afterUserScroll();
      this._emit('scroll', { time: g.time });
      this._panVel *= Math.pow(0.95, dt / 16);   // momentum decay
      if (Math.abs(this._panVel) > 0.003) this._flingRAF = requestAnimationFrame(step);
      else { this._panVel = 0; this._flingRAF = null; }
    };
    this._flingRAF = requestAnimationFrame(step);
  }

  /* ====================================================================== *
   *  PUBLIC API
   * ====================================================================== */
  /**
   * Load a recording. `ext` implies the bytes per sample; `layout`
   * ({bytesPerSample, headerBytes}) overrides it and the constructor options
   * for this buffer only. While following (`opts.follow` / `setFollow`), the
   * view moves to the new live end.
   */
  loadBuffer(arrayBuffer, ext = 'rcfm', layout = {}) {
    this._buffer = arrayBuffer;             // keep for download
    this._ext = (ext || 'rcfm').replace('.', '');
    this.graph.signals.loadBuffer(arrayBuffer, ext, layout);
    if (this.graph.time === 0 || this.graph.time < this.graph.signals.start) {
      this.graph.time = this.graph.signals.start;
    }
    this.graph.resize();                    // winlength, needed by the live end
    const moved = this._follow && this.graph.time !== this._liveEnd();
    if (this._follow) this.graph.time = this._liveEnd();
    this.graph.redraw();
    this._updateScrollBar();
    this._updateButtonVisibility();
    if (moved) this._emit('scroll', { time: this.graph.time, source: 'follow' });
    return this;
  }

  loadMarkers(text) { this.graph.signals.loadMarkers(text); this.graph.redraw(); this._updateButtonVisibility(); this._markersChanged(); return this; }

  setMarkers(list) { this.graph.signals.setMarks(list); this.graph.redraw(); this._updateButtonVisibility(); this._markersChanged(); return this; }

  /** Hide the toggle buttons whose data is absent (e.g. no contraction zones). */
  _updateButtonVisibility() {
    const s = this.graph.signals;
    const marks = s.Marks || [];
    const hasType = (t) => marks.some((m) => m && m[1] && m[1][0] === '$' && m[1].substring(2, 5) === t);
    const hasText = marks.some((m) => m && m[1] && m[1][0] !== '$' && m[1][0] !== '§'); // `§` is never drawn
    const hasBaseline = (s.baselineRCF && s.baselineRCF.length > 0) || hasType('ACC') || hasType('DEC');
    const show = (name, on) => { if (this._btn[name]) this._btn[name].style.display = on ? '' : 'none'; };
    show('baseline', hasBaseline);
    show('contractions', hasType('CON'));
    show('falsesignals', hasType('URS') || hasType('NTA'));
    show('markers', hasText);
  }

  getMarkers() { return this.graph.signals.getMarks(); }

  /** Serialize markers to the on-disk marker-file format (7-digit sample + text). */
  markersText() {
    return this.getMarkers()
      .map((m) => String(m[0]).padStart(7, '0') + ' ' + m[1])
      .join('\n');
  }

  /** Trigger a client-side download of the recording and its marker file. */
  download(basename = 'recording') {
    const dl = (data, type, fname) => {
      const url = URL.createObjectURL(new Blob([data], { type }));
      const a = document.createElement('a');
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    if (this._buffer) dl(this._buffer, 'application/octet-stream', `${basename}.${this._ext}`);
    dl(this.markersText() + '\n', 'text/plain', `${basename}.marks`);
    return this;
  }

  /**
   * Build a multi-page landscape **PDF** of the whole recording and download
   * it. Geometry: 1 cm/min horizontally (3 with `cmPerMin: 3`) and 20 bpm/cm
   * vertically (a 12.63 cm graph area gives 20 bpm/cm for the default 50–210
   * range); consecutive pages overlap by ~2 min so nothing falls on a seam.
   * The PDF is assembled in-page (one JPEG strip per page) and saved via a
   * Blob download, so it works even inside a notebook iframe where
   * window.open()/print() is blocked.
   *
   * Options: cmPerMin (1 | 3), paper ('A4' | 'letter' | 'legal'), header
   * (array of text lines printed above the strip on every page, followed by
   * "page i/n" — which `pageNumbers` forces on or off), footer (one line at
   * the bottom), fillLastPage (keep the
   * regular pace on the last page and fill it with an empty grid instead of
   * sliding back over the previous page), filename, pageWidthCm,
   * pageHeightCm, overlapMin. The printed axis follows `timeZone` and the
   * printed channels follow `delays`, like the screen.
   */
  print(opts = {}) {
    const src = this.graph, s = src.signals;
    if (s.start < 0) return this;
    const pxPerCm = 37.8 * 2;                       // 2x oversampling for crisp print
    // Paper: [width pt, height pt, printable strip width cm], landscape.
    const PAPERS = { A4: [842, 595, 27], letter: [792, 612, 25.5], legal: [1008, 612, 33] };
    const paper = PAPERS[opts.paper] || PAPERS.A4;
    const Wcm = opts.pageWidthCm || paper[2];       // fill the printable width (~1 cm/min)
    const Hcm = opts.pageHeightCm || 12.63;         // graph area -> 20 bpm/cm
    const overlapSec = (opts.overlapMin != null ? opts.overlapMin : 2) * 60;
    const headerLines = Array.isArray(opts.header) ? opts.header.map((l) => String(l)) : [];
    const footer = opts.footer ? String(opts.footer) : '';
    // "page i/n" comes with the header block; `pageNumbers` forces it either way,
    // so a print with no text options is the one this viewer has always made.
    const pageNumbers = opts.pageNumbers != null ? !!opts.pageNumbers : (headerLines.length > 0 || !!footer);

    // Offscreen render surface that reuses the parsed signals + display state.
    const box = document.createElement('div');
    box.style.cssText = `position:absolute;left:-99999px;top:0;`
      + `width:${Math.round(Wcm * pxPerCm)}px;height:${Math.round(Hcm * pxPerCm)}px;`;
    box.innerHTML = '<canvas class="background-canvas"></canvas><svg class="frontground-svg"></svg>';
    document.body.appendChild(box);
    const gp = new GraphPlot(box, { channelVisible: this.channelVisible });
    gp.signals = s;                                 // share parsed data + marks
    gp.displayMorpho = src.displayMorpho;
    gp.displayContractions = src.displayContractions;
    gp.displayFalseSignals = src.displayFalseSignals;
    gp.interpolate = src.interpolate;
    gp.channels = src.channels;
    gp.tzOffset = src.tzOffset;
    gp.timeZone = src.timeZone;                      // printed axis in the zone of the screen
    gp.delays = src.delays;                          // printed channels follow the display
    gp.is3cm = opts.cmPerMin === 3 ? 1 : 0;          // 1 cm/min (default) or 3 cm/min
    gp.fullGrid = 1;

    gp.time = s.start;
    gp.redraw();
    const winSec = gp.winlength;
    const step = Math.max(60, winSec - overlapSec);
    const totalSec = s.lastTime - s.start;
    const nPages = Math.max(1, Math.ceil((totalSec - overlapSec) / step));

    const PT = 28.3465;                              // points per cm
    const W = paper[0], H = paper[1];                // landscape page (points)
    const imgWpt = Wcm * PT, imgHpt = Hcm * PT;      // place the strip at its real cm size
    const jpegs = [];
    let imgW = 0, imgH = 0;
    for (let i = 0; i < nPages; i++) {
      // With fillLastPage the last page keeps the regular pace and is filled
      // with an empty grid instead of sliding back over the previous page.
      gp.time = opts.fillLastPage
        ? s.start + i * step
        : Math.min(s.start + i * step, Math.max(s.start, s.lastTime - winSec));
      gp.redraw();
      imgW = gp.canvas.width; imgH = gp.canvas.height;
      const b64 = gp.canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
      const bin = atob(b64), u = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
      jpegs.push(u);
    }
    document.body.removeChild(box);

    const pdf = this._buildPdf(jpegs, imgW, imgH, W, H, imgWpt, imgHpt, { header: headerLines, footer, pageNumbers });
    const url = URL.createObjectURL(new Blob([pdf], { type: 'application/pdf' }));
    const a = document.createElement('a');
    a.href = url; a.download = `${opts.filename || 'ctg'}.pdf`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return this;
  }

  /**
   * Assemble a minimal multi-page PDF, one full-strip DCTDecode (JPEG) per
   * page, with an optional header block (real PDF text, so it stays
   * searchable and extractable), "page i/n" and a footer line.
   */
  _buildPdf(jpegs, imgW, imgH, W, H, imgWpt, imgHpt, text = {}) {
    const parts = [];
    let length = 0;
    const enc = (str) => {
      const a = new Uint8Array(str.length);
      for (let i = 0; i < str.length; i++) a[i] = str.charCodeAt(i) & 0xff;
      return a;
    };
    const add = (d) => { const u = d instanceof Uint8Array ? d : enc(d); parts.push(u); length += u.length; };
    const off = {};
    const obj = (num, body) => {
      off[num] = length;
      add(`${num} 0 obj\n`);
      if (typeof body === 'string') add(`${body}\n`);
      else { add(`${body.dict}\nstream\n`); add(body.stream); add('\nendstream\n'); }
      add('endobj\n');
    };
    const n = jpegs.length;
    const header = text.header || [], footer = text.footer || '';
    const lineH = 11, headerH = header.length ? 8 + header.length * lineH : 0;
    const pdfText = (str) => {
      // WinAnsi: Latin-1 bytes; escape the PDF string delimiters.
      let out = '';
      for (const ch of String(str)) {
        const c = ch.charCodeAt(0);
        if (ch === '(' || ch === ')' || ch === '\\') out += '\\' + ch;
        else if (c === 0x2014) out += '\\227';           // em dash
        else if (c === 0x2013) out += '\\226';           // en dash
        else if (c === 0x2019) out += "'";
        else if (c === 0x2026) out += '...';
        else if (c === 0xB7) out += '\\267';
        else if (c > 255) out += '?';
        else if (c > 126) out += '\\' + c.toString(8).padStart(3, '0');
        else out += ch;
      }
      return out;
    };
    const total = 3 + 3 * n;                         // catalog, pages, font, then 3 objects per page
    add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    const pageNums = [];
    for (let i = 0; i < n; i++) pageNums.push(6 + 3 * i);
    obj(2, `<< /Type /Pages /Count ${n} /Kids [${pageNums.map((p) => `${p} 0 R`).join(' ')}] >>`);
    obj(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const ty = (H - imgHpt - 20 - headerH).toFixed(2);   // 20 pt top margin + header block
    const tx = (Math.max(0, (W - imgWpt) / 2)).toFixed(2);   // centre the strip in X
    for (let i = 0; i < n; i++) {
      const img = 4 + 3 * i, content = 5 + 3 * i, page = 6 + 3 * i;
      obj(img, {
        dict: `<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} `
          + `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegs[i].length} >>`,
        stream: jpegs[i],
      });
      let cs = `q ${imgWpt.toFixed(2)} 0 0 ${imgHpt.toFixed(2)} ${tx} ${ty} cm /Im Do Q\n`;
      let y = H - 20;
      header.forEach((line, k) => {
        const size = k === 0 ? 10 : 9;
        cs += `BT /F1 ${size} Tf ${tx} ${(y - size).toFixed(2)} Td (${pdfText(line)}) Tj ET\n`;
        y -= lineH;
      });
      if (text.pageNumbers) cs += `BT /F1 9 Tf ${(W - 80).toFixed(2)} ${(H - 30).toFixed(2)} Td (${pdfText(`page ${i + 1}/${n}`)}) Tj ET\n`;
      if (footer) cs += `BT /F1 7 Tf ${tx} 12 Td (${pdfText(footer)}) Tj ET\n`;
      obj(content, { dict: `<< /Length ${cs.length} >>`, stream: enc(cs) });
      obj(page, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] `
        + `/Resources << /XObject << /Im ${img} 0 R >> /Font << /F1 3 0 R >> >> /Contents ${content} 0 R >>`);
    }
    const xref = length;
    add(`xref\n0 ${total + 1}\n0000000000 65535 f \n`);
    for (let num = 1; num <= total; num++) add(`${String(off[num] || 0).padStart(10, '0')} 00000 n \n`);
    add(`trailer\n<< /Size ${total + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    const out = new Uint8Array(length);
    let p = 0;
    for (const u of parts) { out.set(u, p); p += u.length; }
    return out;
  }

  /** Scroll to an epoch (>= 100000) or a fraction (0..1). */
  scrollTo(epochOrFraction) {
    const g = this.graph, s = g.signals;
    if (epochOrFraction >= 0 && epochOrFraction <= 1) {
      this._onScroll(epochOrFraction, false);
    } else {
      g.time = Math.min(Math.max(epochOrFraction, s.start), s.lastTime - g.winlength + 120);
      g.redraw();
      this._updateScrollBar();
      this._emit('scroll', { time: g.time });
    }
    return this;
  }

  setScale(cmPerMin) {
    this.graph.is3cm = cmPerMin === 3 ? 1 : 0;
    this._btn.scale.classList.toggle('active', !!this.graph.is3cm);
    this._snapToLiveEnd();
    this.graph.redraw();
    this._updateScrollBar();
    this._emit('scaleChange', { cmPerMin: this.graph.is3cm ? 3 : 1, is3cm: this.graph.is3cm });
    return this;
  }

  toggle3cm() { return this.setScale(this.graph.is3cm ? 1 : 3); }

  /**
   * Per-sensor estimation delays of the monitor, in seconds —
   * {doppler, scalp, mecg, mhrToco, mhrOximeter, toco}; a null value = unknown
   * = no shift for that sensor; `null` = no compensation (raw samples).

  setDelays(delays) {
    this.graph.delays = delays && typeof delays === 'object' ? { ...delays } : null;

    if (this.graph.signals.start >= 0) this.graph.redraw();

    return this;
  }

  getDelays() { return this.graph.delays ? { ...this.graph.delays } : null; }

  /** Lock the view on the live end of the recording (each `loadBuffer` keeps the end in view); `false` releases it. */
  setFollow(on) {
    this._follow = !!on;
    this._btn.follow.classList.toggle('active', this._follow);
    if (this._follow && this.graph.signals.start >= 0) {
      this.graph.resize();
      this.graph.time = this._liveEnd();
      this.graph.redraw();
      this._updateScrollBar();
      this._emit('scroll', { time: this.graph.time, source: 'follow' });
    }
    this._emit('followChange', { on: this._follow });
    return this;
  }

  getFollow() { return this._follow; }

  /** Set the time-axis timezone: an offset in seconds (0 = UTC) or an IANA zone name ('Europe/Paris'). */
  setTimezone(offsetSecondsOrZone) {
    if (typeof offsetSecondsOrZone === 'string') this.graph.timeZone = offsetSecondsOrZone || null;
    else { this.graph.timeZone = null; this.graph.tzOffset = Number(offsetSecondsOrZone) || 0; }
    this.graph.redraw();
    this._emit('timezoneChange', { offsetSeconds: this.graph.tzOffset, timeZone: this.graph.timeZone });
    return this;
  }

  setHeight(px) {
    px = Math.max(160, Math.round(px));
    this.host.style.height = `${px}px`;
    // If embedded in a same-origin srcdoc iframe (the notebook case), grow the
    // iframe too so the cell follows the height instead of clipping the bottom.
    try {
      const fr = window.frameElement;
      if (fr) fr.style.height = `${px + 4}px`;
    } catch (e) { /* cross-origin frame: ignore */ }
    this._snapToLiveEnd();
    if (this.graph.signals.start >= 0) this.graph.redraw();
    this._updateScrollBar();
    this._emit('heightChange', { height: px });
    return this;
  }

  setChannelVisible(name, visible) {

    if (name === 'MHR') this._renderMhrButton();

  setChannels(list) { this.graph.channels = Array.isArray(list) ? list.slice() : null; this.graph.redraw(); return this; }

  setZonesVisible(on) {

    this._btn.baseline.classList.toggle('active', !!on);
    this.graph.redraw();
    this._emit('zonesChange', { on: !!on });
    return this;
  }

  setContractionsVisible(on) {
    this.graph.displayContractions = !!on;
    this._btn.contractions.classList.toggle('active', !!on);
    this.graph.redraw();
    this._emit('contractionsChange', { on: !!on });
    return this;
  }

  setFalseSignalsVisible(on) {
    this.graph.displayFalseSignals = !!on;
    this._btn.falsesignals.classList.toggle('active', !!on);
    this.graph.redraw();
    this._emit('falseSignalsChange', { on: !!on });
    return this;
  }

  setMarksVisible(on) {
    this.graph.displayMarks = !!on;
    this._btn.markers.classList.toggle('active', !!on);
    this.graph.redraw();
    this._emit('marksChange', { on: !!on });
    return this;
  }

  /** Configure the top FHR grid bounds (bpm). */
  setRange(minBpm, maxBpm) {
    this.graph.signals.minRCF = Number(minBpm);
    this.graph.signals.maxRCF = Number(maxBpm);
    // The grid bounds set the vertical scale, and the vertical scale sets
    // winlength: while following, the live end must stay in view.
    this._snapToLiveEnd();
    this.graph.redraw();
    this._updateScrollBar();
    this._emit('rangeChange', { min: this.graph.signals.minRCF, max: this.graph.signals.maxRCF });
    return this;
  }

  /** Configure the central safe / normal FHR band (bpm). */
  setSafeZone(minBpm, maxBpm) {
    this.graph.signals.safeMin = Number(minBpm);
    this.graph.signals.safeMax = Number(maxBpm);
    this.graph.redraw();
    this._emit('safeZoneChange', { min: this.graph.signals.safeMin, max: this.graph.signals.safeMax });
    return this;
  }

  setInterpolate(on) {
    this.graph.interpolate = !!on;
    this._btn.interpolate.classList.toggle('active', !!on);
    this.graph.redraw();
    this._emit('interpolateChange', { on: !!on });
    return this;
  }

  /* --- event emitter + bridge -------------------------------------------- */
  on(event, cb) { (this._listeners[event] = this._listeners[event] || []).push(cb); return this; }

  off(event, cb) {
    if (!this._listeners[event]) return this;
    if (!cb) { delete this._listeners[event]; return this; }
    this._listeners[event] = this._listeners[event].filter((f) => f !== cb);
    return this;
  }

  _emit(event, detail) {
    detail = detail || {};
    (this._listeners[event] || []).forEach((cb) => { try { cb(detail); } catch (e) { /* noop */ } });
    // bridge to host (Python) — postMessage + optional injected sink.
    const msg = { source: 'fhrviewer', event, detail };
    try { if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) { /* noop */ }
    try { if (this._messageSink) this._messageSink(msg); } catch (e) { /* noop */ }
    // also dispatch a CustomEvent on the host element
    this.host.dispatchEvent(new CustomEvent(`fhr-${event}`, { detail, bubbles: true }));
  }

  _markersChanged() { this._emit('markersChange', { markers: this.getMarkers() }); }
}

// Convenience: auto-upgrade any element with data-fhr-viewer (optional).
function upgradeAll(root = document) {
  const out = [];
  root.querySelectorAll('[data-fhr-viewer]').forEach((el) => out.push(new FHRViewer(el)));
  return out;
}
